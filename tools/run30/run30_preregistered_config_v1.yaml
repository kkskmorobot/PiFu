# Run30: plain seed43 baseline plus one targeted MEL-to-NV posterior focal risk loss.
# No test or external candidate is present in this configuration.

contract:
  version: run30_yolo26m_plain_mel_nv_focal_risk_seed43_v1
  role: second_independent_risk_loss_experiment_after_run29_rejection
  single_preregistered_factor: add_true_mel_to_nv_posterior_focal_risk_gamma_2_weight_0_5_to_run22
  comparison_policy: strict_paired_comparison_against_run22_same_seed43_plain_baseline
  baseline_run: experiments/22_YOLO26m_Binary8Class_Plain_Seed43Replication
  baseline_fingerprint: 6a9cc96bd2d21f28b9c17ed745a50e76846f05d9c96153b2bad69f59c7257e82
  test_policy: forbidden_until_final_model_lock_and_fresh_user_authorization
  external_policy: forbidden_for_training_selection_threshold_tuning_and_preflight

ultralytics:
  task: semantic
  mode: train
  model: models/yolo26m-sem.pt
  data: tools/run30/run30_development_data.yaml
  epochs: 100
  patience: 30
  batch: 16
  imgsz: 640
  device: 0
  workers: 8
  project: experiments/30_YOLO26m_Binary8Class_Plain_MELNVFocalRisk_Seed43/results
  name: run30_yolo26m_plain_mel_nv_focal_risk_seed43
  exist_ok: false
  pretrained: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  nbs: 64
  seed: 43
  deterministic: true
  amp: true
  cache: false
  save: true
  save_period: -1
  plots: true
  val: true
  verbose: true
  fraction: 1.0
  single_cls: false
  rect: false
  multi_scale: false
  dropout: 0.0

amp_check:
  asset: tools/yolo26n.pt
  sha256: 9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef
  working_directory: tools
  runtime_download: forbidden_local_asset_required

early_stopping:
  policy: delayed_utility_gated_v1
  start_epoch: 40
  patience_after_start: 30
  earliest_possible_stop_epoch: 70
  ineligible_score: joint_score_minus_two
  eligible_score: original_joint_minus_mel_to_nv_excess_fitness
  utility_eligible_requires:
    min_binary_iou: 0.70
    min_group_macro_f1: 0.50
  applies_to: [ultralytics_stopper, ultralytics_best_pt]
  does_not_change: [validation_metrics, checkpoint_selection_aliases]

augmentations:
  hsv_h: 0.005
  hsv_s: 0.10
  hsv_v: 0.10
  degrees: 5.0
  translate: 0.03
  scale: 0.10
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  bgr: 0.0
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  auto_augment: null
  erasing: 0.0

multitask:
  semantic_classes: 1
  classification_classes: 8
  image_cls_weight: 0.5
  image_head: plain_p3_p4_global_average_pool_mlp_dropout020
  classification_loss: unweighted_cross_entropy_plus_true_mel_to_nv_posterior_focal_risk
  classification_label_smoothing: 0.0
  sampler: standard_seeded_epoch_shuffle_without_replacement
  epoch_size: all_23462_train_samples_once
  segmentation_loss_scope: has_segmentation_only
  classification_loss_scope: has_official_classification_only

risk_loss:
  enabled: true
  name: true_mel_to_nv_posterior_focal_risk
  weight_inside_classification_objective: 0.5
  gamma: 2.0
  true_class_id: 4
  risk_class_id: 5
  formula: mean_true_mel_p_nv_pow_gamma_times_negative_log_one_minus_p_nv
  normalization: true_mel_rows_only
  non_mel_auxiliary_gradient: zero
  application_scope: labeled_samples_in_training_objective_and_val_loss_reporting
  optimization_scope: training_only
  new_parameters: 0
  validation_loss_does_not_change_metrics_or_selection: true
  inference_rule: unchanged_eight_class_argmax

attention_ablation:
  enabled: false
  same_as_run22: plain_p3_p4_global_average_pool_mlp_dropout020
  plain_descriptor_scales: [P3, P4]
  pooling: global_average
  semantic_branch_modified: false

checkpoint:
  bundle_version: pifuv2_multitask_checkpoint_v2
  keep_last: 3
  resume_default: auto
  safe_boundary: completed_epoch
  require_success_hash_and_fingerprint: true
  save_live_model_ema_optimizer_scaler_scheduler_stopper_rng_data_progress: true

selection:
  primary_alias: best_feasible_joint
  joint_score: sqrt_binary_iou_times_group_macro_f1
  max_mel_to_nv_rate: 0.1077844311
  min_binary_iou: 0.70
  min_group_macro_f1: 0.50
  feasible_requires: mel_support_and_risk_limit_and_non_degenerate_utility_floors
  fitness_policy: unchanged_joint_minus_mel_to_nv_excess_only
  fallback_if_no_feasible: constraint_failure_report_best_joint_for_diagnosis_only
  tie_break_order: [higher_group_macro_f1, higher_binary_iou, earlier_epoch]
  semantic_probability_threshold: 0.5
  classification_decision: argmax
  calibration_temperature: 1.0
  fit_temperature_or_threshold_on_external: false

