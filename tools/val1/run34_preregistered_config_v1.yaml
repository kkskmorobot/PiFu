decision_rule:
  name: fixed_asymmetric_expected_cost_v1
  classes: [akiec, bcc, bkl, df, mel, nv, vasc, scc]
  malignant_classes: [bcc, mel, scc]
  correct_cost: 0.0
  ordinary_error_cost: 1.0
  malignant_to_benign_cost: 4.0
  mel_to_nv_cost: 8.0
  prediction: argmin_posterior_expected_cost
  tie_break: lower_class_id

acceptance_gate:
  comparison: fixed_cost_minus_argmax_across_three_frozen_seeds
  require_each_seed_non_increasing_mel_to_nv: true
  require_each_seed_non_increasing_malignant_to_benign: true
  min_mean_delta_mel_to_nv: -0.10
  min_mean_delta_malignant_to_benign: -0.05
  min_mean_delta_group_macro_f1: -0.03
  min_mean_delta_joint: -0.02
  min_each_seed_delta_group_macro_f1: -0.06
  action_if_pass: lock_fixed_cost_rule_for_final_candidate
  action_if_fail: retain_argmax_and_stop_decision_rule_tuning

selection:
  max_mel_to_nv_rate: 0.1077844311
  min_binary_iou: 0.70
  min_group_macro_f1: 0.50
  joint_score: sqrt_binary_iou_times_group_macro_f1
