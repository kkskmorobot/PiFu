# Run33 seed43 YOLO26m P3/P4 standard CBAM, paired with Run22 plain.
# No test or external candidate is present in this configuration.

contract:
  version: run33_yolo26m_p3p4_standard_cbam_seed43_v1
  role: standard_cbam_single_factor_comparison_against_run22_seed43_plain
  single_preregistered_factor: add_conventional_classifier_only_p3_p4_standard_cbam
  comparison_policy: paired_seed43_single_factor_standard_cbam_comparison_against_run22
  baseline_run: experiments/22_YOLO26m_Binary8Class_Plain_Seed43Replication
  baseline_fingerprint: 6a9cc96bd2d21f28b9c17ed745a50e76846f05d9c96153b2bad69f59c7257e82
  metric_protocol_note: validation_metrics_selection_aliases_and_lifecycle_unchanged_from_run22
  test_policy: forbidden_until_final_model_lock_and_fresh_user_authorization
  external_policy: forbidden_for_training_selection_and_threshold_tuning

ultralytics:
  task: semantic
  mode: train
  model: models/yolo26m-sem.pt
  data: tools/run33/run33_development_data.yaml
  epochs: 100
  patience: 30
  batch: 16
  imgsz: 640
  device: 0
  workers: 8
  project: experiments/33_YOLO26m_Binary8Class_P3P4_StandardCBAM_Seed43/results
  name: run33_yolo26m_p3p4_standard_cbam_seed43
  exist_ok: false
  pretrained: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  nbs: 64
  seed: 43
  deterministic: true
  amp: true
  cache: false
  save: true
  save_period: -1
  plots: true
  val: true
  verbose: true
  fraction: 1.0
  single_cls: false
  rect: false
  multi_scale: false
  dropout: 0.0

amp_check:
  asset: tools/yolo26n.pt
  sha256: 9b09cc8bf347f0fc8a5f7657480587f25db09b34bf33b0652110fb03a8ad4fef
  working_directory: tools
  runtime_download: forbidden_local_asset_required

early_stopping:
  policy: delayed_utility_gated_v1
  start_epoch: 40
  patience_after_start: 30
  earliest_possible_stop_epoch: 70
  ineligible_score: joint_score_minus_two
  eligible_score: original_joint_minus_mel_to_nv_excess_fitness
  utility_eligible_requires:
    min_binary_iou: 0.70
    min_group_macro_f1: 0.50
  applies_to:
    - ultralytics_stopper
    - ultralytics_best_pt
  does_not_change:
    - validation_metrics
    - checkpoint_selection_aliases

augmentations:
  hsv_h: 0.005
  hsv_s: 0.10
  hsv_v: 0.10
  degrees: 5.0
  translate: 0.03
  scale: 0.10
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  bgr: 0.0
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  auto_augment: null
  erasing: 0.0

multitask:
  semantic_classes: 1
  classification_classes: 8
  image_cls_weight: 0.5
  image_head: p3_p4_standard_cbam_global_average_pool_mlp_dropout020
  classification_loss: unweighted_cross_entropy
  classification_label_smoothing: 0.0
  sampler: standard_seeded_epoch_shuffle_without_replacement
  epoch_size: all_23462_train_samples_once
  segmentation_loss_scope: has_segmentation_only
  classification_loss_scope: has_official_classification_only

cbam_attention:
  enabled: true
  baseline_run22: p3_p4_plain_global_average_pool_mlp_dropout020
  scales: [P3, P4]
  channel_mechanism: shared_mlp_avg_max
  channel_reduction: 16
  spatial_mechanism: channel_mean_max_conv
  spatial_kernel_size: 7
  gate_scaling: sigmoid
  initialization: conventional_pytorch_default
  pooling_after_attention: global_average
  classifier_only: true
  p5_descriptor: false
  semantic_branch_modified: false

checkpoint:
  bundle_version: pifuv2_multitask_checkpoint_v2
  keep_last: 3
  resume_default: auto
  safe_boundary: completed_epoch
  require_success_hash_and_fingerprint: true
  save_live_model_ema_optimizer_scaler_scheduler_stopper_rng_data_progress: true

selection:
  primary_alias: best_feasible_joint
  joint_score: sqrt_binary_iou_times_group_macro_f1
  max_mel_to_nv_rate: 0.1077844311
  min_binary_iou: 0.70
  min_group_macro_f1: 0.50
  feasible_requires: mel_support_and_risk_limit_and_non_degenerate_utility_floors
  fitness_policy: unchanged_joint_minus_mel_to_nv_excess_only
  fallback_if_no_feasible: constraint_failure_report_best_joint_for_diagnosis_only
  tie_break_order:
    - higher_group_macro_f1
    - higher_binary_iou
    - earlier_epoch
  semantic_probability_threshold: 0.5
  classification_decision: argmax
  calibration_temperature: 1.0
  fit_temperature_or_threshold_on_external: false

replication_gate:
  comparison_row: each_runs_best_joint_score_bundle_row
  baseline_run22:
    binary_iou: 0.76377
    image_macro_f1: 0.55017
    group_macro_f1: 0.62811
    group_recall: 0.64033
    mel_to_nv: 0.40816
    malignant_to_benign: 0.28502
    joint: 0.69263
  utility_guardrails:
    min_delta_binary_iou: -0.005
    min_delta_group_macro_f1: -0.010
    min_delta_joint: -0.005
  material_benefit_requires_any:
    min_delta_image_macro_f1: 0.010
    min_delta_group_macro_f1: 0.010
    min_delta_joint: 0.005
    max_delta_mel_to_nv: -0.030
    max_delta_malignant_to_benign: -0.020
  action_if_pass: preregister_exact_seed42_and_seed44_replications
  action_if_fail: stop_standard_cbam_after_seed43_and_enter_model_lock
