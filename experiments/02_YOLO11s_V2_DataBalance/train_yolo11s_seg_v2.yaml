# Data-V2 control experiment. The model architecture and optimizer match the
# original baseline; only the audited dataset and its compatible online
# augmentation policy change. Test remains untouched during training.
model: models/yolo11s-seg.pt
data: Data/processed_skin7_v2/data.yaml

epochs: 120
patience: 25
batch: 16
imgsz: 640
device: 0
workers: 8

project: experiments/02_YOLO11s_V2_DataBalance/reruns/segment
name: skin7_yolo11s_data_v2
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

seed: 42
deterministic: true
amp: true
cache: false
save: true
save_period: 10
plots: true
val: true

# V2 already contains paired geometric/photometric augmentation. Keep online
# augmentation mild so lesion color and texture are not distorted twice.
hsv_h: 0.0
hsv_s: 0.08
hsv_v: 0.08
degrees: 5.0
translate: 0.02
scale: 0.10
shear: 0.0
perspective: 0.0
flipud: 0.25
fliplr: 0.25
mosaic: 0.05
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
close_mosaic: 10

overlap_mask: true
mask_ratio: 4
single_cls: false
rect: false
multi_scale: false
