# Run17 controlled YOLO26m plain-head baseline for the graduation-thesis attention ablation.
# No test or external candidate is present in this configuration.

contract:
  version: run17_yolo26m_binary_partial_label_baseline_v1
  role: controlled_single_factor_attention_ablation_baseline_for_run16
  single_preregistered_factor: remove_binary_lesion_guided_attention_from_run16
  comparison_policy: causal_single_factor_comparison_against_run16
  baseline_run: experiments/16_YOLO26m_Binary8Class_BinaryLesionGuidedAttention
  baseline_fingerprint: 2433474d4f826d8fcfed94e946eb9facf54d4ac13c20fdc5e2720855ddf18e27
  superseded_draft: run17_boundary_attention_preflight_archived_before_formal_baseline_preregistration
  metric_protocol_note: run16_non_degenerate_utility_floors_and_fitness_retained
  test_policy: forbidden_until_final_model_lock_and_fresh_user_authorization
  external_policy: forbidden_for_training_selection_and_threshold_tuning

ultralytics:
  task: semantic
  mode: train
  model: models/yolo26m-sem.pt
  data: experiments/17_YOLO26m_Binary8Class_PartialLabel_Baseline/run17_development_data.yaml
  epochs: 100
  patience: 20
  batch: 16
  imgsz: 640
  device: 0
  workers: 8
  project: experiments/17_YOLO26m_Binary8Class_PartialLabel_Baseline/results
  name: run17_yolo26m_binary8cls_partial_label_baseline_seed42
  exist_ok: false
  pretrained: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  nbs: 64
  seed: 42
  deterministic: true
  amp: true
  cache: false
  save: true
  save_period: -1
  plots: true
  val: true
  verbose: true
  fraction: 1.0
  single_cls: false
  rect: false
  multi_scale: false
  dropout: 0.0

augmentations:
  hsv_h: 0.005
  hsv_s: 0.10
  hsv_v: 0.10
  degrees: 5.0
  translate: 0.03
  scale: 0.10
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  bgr: 0.0
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  auto_augment: null
  erasing: 0.0

multitask:
  semantic_classes: 1
  classification_classes: 8
  image_cls_weight: 0.5
  image_head: plain_p3_p4_global_average_pool_mlp_dropout020
  classification_loss: unweighted_cross_entropy
  classification_label_smoothing: 0.0
  sampler: standard_seeded_epoch_shuffle_without_replacement
  epoch_size: all_23462_train_samples_once
  segmentation_loss_scope: has_segmentation_only
  classification_loss_scope: has_official_classification_only

attention_ablation:
  enabled: false
  removed_from_run16: binary_lesion_guided_p3_p4_p5_eca_mask_pool
  plain_descriptor_scales: [P3, P4]
  pooling: global_average
  semantic_branch_modified: false

checkpoint:
  bundle_version: pifuv2_multitask_checkpoint_v2
  keep_last: 3
  resume_default: auto
  safe_boundary: completed_epoch
  require_success_hash_and_fingerprint: true
  save_live_model_ema_optimizer_scaler_scheduler_stopper_rng_data_progress: true

selection:
  primary_alias: best_feasible_joint
  joint_score: sqrt_binary_iou_times_group_macro_f1
  max_mel_to_nv_rate: 0.1077844311
  min_binary_iou: 0.70
  min_group_macro_f1: 0.50
  feasible_requires: mel_support_and_risk_limit_and_non_degenerate_utility_floors
  fitness_policy: unchanged_joint_minus_mel_to_nv_excess_only
  fallback_if_no_feasible: constraint_failure_report_best_joint_for_diagnosis_only
  tie_break_order:
    - higher_group_macro_f1
    - higher_binary_iou
    - earlier_epoch
  semantic_probability_threshold: 0.5
  classification_decision: argmax
  calibration_temperature: 1.0
  fit_temperature_or_threshold_on_external: false
