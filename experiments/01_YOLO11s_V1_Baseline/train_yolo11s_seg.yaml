# Conservative baseline for the balanced HAM10000 seven-class segmentation dataset.
# Paths are resolved relative to the PiFuV2 project root by train_skin7.py.
model: models/yolo11s-seg.pt
data: Data/processed_skin7/data.yaml

epochs: 120
patience: 25
batch: 16
imgsz: 640
device: 0
workers: 8

project: experiments/01_YOLO11s_V1_Baseline/reruns/segment
name: skin7_yolo11s_baseline
exist_ok: false
pretrained: true
optimizer: AdamW
lr0: 0.001
lrf: 0.01
cos_lr: true
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0

seed: 42
deterministic: true
amp: true
cache: false
save: true
save_period: 10
plots: true
val: true

# Mild online augmentation: offline augmentation has already balanced minorities.
hsv_h: 0.01
hsv_s: 0.25
hsv_v: 0.20
degrees: 10.0
translate: 0.05
scale: 0.30
shear: 0.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
mosaic: 0.20
mixup: 0.0
cutmix: 0.0
copy_paste: 0.0
close_mosaic: 10

overlap_mask: true
mask_ratio: 4
single_cls: false
rect: false
multi_scale: false
