# Run15 targeted MEL-vs-NV decision-boundary follow-up to frozen Run12 attention.
# No test or external candidate is present in this configuration.

contract:
  version: run15_binary_lesion_guided_attention_mel_nv_pairwise_margin_v1
  role: controlled_single_factor_risk_boundary_followup_to_run12
  single_preregistered_factor: add_direct_mel_nv_pairwise_softplus_boundary_loss_to_run12_attention
  comparison_policy: causal_single_factor_comparison_against_run12
  baseline_run: experiments/12_YOLO26s_Binary8Class_BinaryLesionGuidedAttention
  baseline_fingerprint: 77ba2344a10784443d11ded2a9e6dff497e92429481a986a3539becdbc45710f
  run13_role: negative_attention_x_full_mel_weight_interaction_diagnostic_not_inherited
  run14_role: eight_way_margin_dilution_and_cold_start_false_feasible_diagnostic_not_inherited
  test_policy: forbidden_until_final_model_lock_and_fresh_user_authorization
  external_policy: forbidden_for_training_selection_and_threshold_tuning

ultralytics:
  task: semantic
  mode: train
  model: models/yolo26s-sem.pt
  data: experiments/15_YOLO26s_Binary8Class_BinaryLesionGuidedAttention_MELNVPairwiseBoundary/run15_development_data.yaml
  epochs: 100
  patience: 20
  batch: 16
  imgsz: 640
  device: 0
  workers: 8
  project: experiments/15_YOLO26s_Binary8Class_BinaryLesionGuidedAttention_MELNVPairwiseBoundary/results
  name: run15_yolo26s_binary8cls_attention_mel_nv_pairwise_margin_seed42
  exist_ok: false
  pretrained: true
  optimizer: AdamW
  lr0: 0.001
  lrf: 0.01
  cos_lr: true
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3.0
  warmup_momentum: 0.8
  warmup_bias_lr: 0.1
  nbs: 64
  seed: 42
  deterministic: true
  amp: true
  cache: false
  save: true
  save_period: -1
  plots: true
  val: true
  verbose: true
  fraction: 1.0
  single_cls: false
  rect: false
  multi_scale: false
  dropout: 0.0

augmentations:
  hsv_h: 0.005
  hsv_s: 0.10
  hsv_v: 0.10
  degrees: 5.0
  translate: 0.03
  scale: 0.10
  shear: 0.0
  perspective: 0.0
  flipud: 0.5
  fliplr: 0.5
  bgr: 0.0
  mosaic: 0.0
  mixup: 0.0
  cutmix: 0.0
  copy_paste: 0.0
  close_mosaic: 0
  auto_augment: null
  erasing: 0.0

multitask:
  semantic_classes: 1
  classification_classes: 8
  image_cls_weight: 0.5
  image_head: binary_lesion_guided_p3_p4_p5_eca_mask_pool_mlp_dropout020
  classification_loss: unweighted_cross_entropy_plus_direct_mel_nv_pairwise_softplus
  classification_label_smoothing: 0.0
  mel_nv_pairwise_margin: 0.5976564790473948
  mel_nv_pairwise_margin_derivation: natural_log_train_nv_count_5539_div_train_mel_count_3047
  mel_nv_pairwise_loss_weight: 1.0
  pairwise_application: training_only_softplus_nv_logit_minus_mel_logit_plus_margin_for_true_mel
  pairwise_reduction: sum_over_true_mel_div_all_labeled_classification_samples
  validation_inference_logits_modified: false
  sampler: standard_seeded_epoch_shuffle_without_replacement
  epoch_size: all_23462_train_samples_once
  segmentation_loss_scope: has_segmentation_only
  classification_loss_scope: has_official_classification_only

lesion_attention:
  spatial_source: detached_sigmoid_binary_semantic_main_logit
  scales: [P3, P4, P5]
  p5_layer: 10
  channel_gate: identity_initialized_eca
  eca_kernel_size: 5
  pooling: half_global_average_plus_half_normalized_lesion_guided_average
  mask_guided_mix: 0.5
  detach_mask: true
  p5_initial_contribution: zero
  semantic_branch_modified: false

checkpoint:
  bundle_version: pifuv2_multitask_checkpoint_v2
  keep_last: 3
  resume_default: auto
  safe_boundary: completed_epoch
  require_success_hash_and_fingerprint: true
  save_live_model_ema_optimizer_scaler_scheduler_stopper_rng_data_progress: true

selection:
  primary_alias: best_feasible_joint
  joint_score: sqrt_binary_iou_times_group_macro_f1
  max_mel_to_nv_rate: 0.1077844311
  min_binary_iou: 0.70
  min_group_macro_f1: 0.50
  feasible_requires: mel_support_and_risk_limit_and_non_degenerate_utility_floors
  fitness_policy: unchanged_joint_minus_mel_to_nv_excess_only
  fallback_if_no_feasible: constraint_failure_report_best_joint_for_diagnosis_only
  tie_break_order:
    - higher_group_macro_f1
    - higher_binary_iou
    - earlier_epoch
  semantic_probability_threshold: 0.5
  classification_decision: argmax
  calibration_temperature: 1.0
  fit_temperature_or_threshold_on_external: false
